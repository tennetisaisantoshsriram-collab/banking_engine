name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare frontend files
        run: |
          mkdir -p dist
          cp frontend/index.html dist/
          cp frontend/styles.css dist/
          # Replace relative /api with full Render backend URL
          sed 's|const API_BASE = .*/api.*;|const API_BASE = '"'"'${{ vars.RENDER_BACKEND_URL || '"'"'https://banking-engine.onrender.com'"'"' }}/api'"'"';|' frontend/app.js > dist/app.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
