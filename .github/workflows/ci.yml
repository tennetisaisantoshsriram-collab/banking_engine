name: CI — Test & Validate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Validate app imports
        run: python -c "import app; print('app.py imports OK')"

      - name: Generate output images
        run: python generate_outputs.py

      - name: Upload output images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: output-charts
          path: outputs/
          retention-days: 30
