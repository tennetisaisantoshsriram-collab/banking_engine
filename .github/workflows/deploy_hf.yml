name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install huggingface_hub
        run: pip install huggingface_hub -q

      - name: Deploy to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: python -u .github/scripts/hf_deploy.py

      - name: Print live URL
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          echo ""
          echo "=========================================="
          echo "  LIVE URL:"
          echo "  https://huggingface.co/spaces/$HF_USERNAME/banking-credit-engine"
          echo "=========================================="
